name: Publish to npm

# Run by hand (workflow_dispatch) or dispatched by auto-release.yml.
#
# It used to ALSO listen to `release: published`. The release is created with
# the release App's token, which does start workflow runs, so every release
# published twice: the release-event run shipped it and the workflow_call run
# then failed with E403 (run 36708042343, v0.7.3). One trigger path now.
#
# It is NOT a reusable workflow (workflow_call) any more. npm trusted publishing
# checks the filename of the TOP-LEVEL workflow: called from auto-release.yml,
# the OIDC token says auto-release.yml, which does not match the npm trusted
# publisher (publish.yml), so npm fell back to NPM_TOKEN and refused it with
# EOTP (v0.9.0, run 45456381801). auto-release.yml now dispatches this workflow,
# so the publish always runs as publish.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.8.0). Defaults to the selected ref.'
        required: false
        default: ''
      version:
        description: 'Version expected on npm afterwards (verified). Defaults to package.json.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve ref
        id: ref
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$TAG" ]; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 can authenticate with npm trusted publishing (OIDC) and
      # only falls back to NPM_TOKEN when no trusted publisher is configured.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Refuse to publish a banned provider
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "
            const fs = require('fs');
            const files = require(process.argv[1])[0].files.map((f) => f.path);
            const hits = files.filter((f) => /pollinations/i.test(fs.readFileSync(f, 'latin1')));
            console.log('scanned ' + files.length + ' packaged files');
            if (hits.length) {
              console.error('::error::published files mention the removed Pollinations provider: ' + hits.join(', '));
              process.exit(1);
            }
          " "$RUNNER_TEMP/pack.json"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm serves the new version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || VERSION=$(node -p "require('./package.json').version")
          node scripts/release-plan.mjs verify --npm "$VERSION" --timeout-s 600
