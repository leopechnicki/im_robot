name: Publish Python SDK

# Publishes the imrobot Python package to PyPI when a tag matching
# `py-v*` is pushed (e.g. `py-v0.7.2`). Kept separate from the JS
# tag namespace so the two SDKs release independently.
on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:
    inputs:
      test-pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: false

jobs:
  build-and-publish:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imrobot
    permissions:
      # Required for PyPI trusted publishing (OIDC) — no long-lived tokens.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF##*/}"          # e.g. py-v0.7.2
          TAG_VERSION="${TAG#py-v}"        # -> 0.7.2
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "Tag says $TAG_VERSION, pyproject says $PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION" || {
            echo "::error::Tag $TAG_VERSION does not match pyproject version $PKG_VERSION"
            exit 1
          }
        if: startsWith(github.ref, 'refs/tags/')
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata
        run: twine check dist/*
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/dist/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/py-v') || (github.event_name == 'workflow_dispatch' && !inputs.test-pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
