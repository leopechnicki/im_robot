name: Auto Release (Friday)

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.create_release.outputs.release_created }}
      release_tag: ${{ steps.create_release.outputs.release_tag }}
      already_published: ${{ steps.npm_check.outputs.already_published }}
    steps:
      # Mint a short-lived GitHub App installation token. The bump branch/PR
      # MUST be created with a non-GITHUB_TOKEN identity: GitHub does not start
      # workflow runs for events triggered by the default GITHUB_TOKEN, which
      # left the required "CI / Node 20|22" checks permanently pending and every
      # auto-bump PR un-mergeable. See PR #89 for one-time App setup instructions.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check if package.json version is already published on npm
        id: npm_check
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Package: ${PKG_NAME}@${PKG_VERSION}"
          # Query npm registry for all published versions. If the current
          # package.json version is already listed, downstream publish.yml would
          # hit E403 ("cannot publish over the previously published version").
          # Skip the reusable publish job in that case so this workflow stays
          # idempotent when re-run (schedule + workflow_dispatch on the same
          # HEAD, or after a manual publish already shipped the version).
          if npm view "$PKG_NAME" versions --json 2>/dev/null \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const v=JSON.parse(d||'[]');process.exit(v.includes(process.argv[1])?0:1)})" "$PKG_VERSION"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${PKG_VERSION} is already published on npm — publish job will be skipped."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} is not yet on npm — publish job will run."
          fi

      - name: Check for new commits since last tag
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, will create initial release"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            COMMITS=$(git rev-list "${LAST_TAG}..HEAD" --count)
            echo "Commits since $LAST_TAG: $COMMITS"
            if [ "$COMMITS" -gt 0 ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create release
        if: steps.check.outputs.has_changes == 'true'
        id: create_release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read current version from package.json (source of truth)
          CURRENT=$(node -p "require('./package.json').version")
          RELEASE_VERSION="v${CURRENT}"
          echo "Release version: $RELEASE_VERSION"

          # Compute next dev version for the bump PR
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Next dev version: $NEXT_VERSION"

          # Guard against tag/release collisions.
          TAG_EXISTS=false
          if git rev-parse "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          elif gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          RELEASE_CREATED=false
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "::warning::Tag/release ${RELEASE_VERSION} already exists â€” skipping release, opening bump PR only."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
            else
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges "${LAST_TAG}..HEAD")
            fi

            gh release create "$RELEASE_VERSION" \
              --title "Release $RELEASE_VERSION" \
              --notes "## What's Changed

          $CHANGELOG

          ---
          *Auto-released on $(date -u +%Y-%m-%d)*" \
              --target main
            RELEASE_CREATED=true
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          fi

          # Open (or reuse) the version-bump PR.
          BRANCH="chore/bump-version-v${NEXT_VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Bump branch ${BRANCH} already exists on origin â€” leaving existing PR in place."
            exit 0
          fi

          git checkout -b "$BRANCH"
          npm version "$NEXT_VERSION" --no-git-tag-version
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: bump version to ${NEXT_VERSION}"
          git push origin "$BRANCH"

          if [ "$RELEASE_CREATED" = "true" ]; then
            PR_BODY="Automated version bump after release ${RELEASE_VERSION}"
          else
            PR_BODY="Automated version bump. Release ${RELEASE_VERSION} was skipped because the tag already exists; merging this PR unblocks next Friday's release."
          fi

          if ! gh pr create \
            --title "chore: bump version to ${NEXT_VERSION}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH"; then
            echo "::notice::PR creation skipped (Actions not permitted). Open manually: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
          fi

  # Directly call publish.yml after the release is created.
  # This bypasses the release:published event trigger entirely â€” GitHub Actions
  # does NOT fire that event for releases created via GITHUB_TOKEN or PAT
  # (anti-recursion protection). workflow_call is not subject to this restriction.
  publish:
    needs: release
    # Only publish when (a) a new GitHub release was created AND
    # (b) the current package.json version is not already on npm.
    # Prevents the reusable publish.yml from hitting npm E403
    # ("cannot publish over the previously published version") when
    # a manual publish already shipped this version.
    if: needs.release.outputs.release_created == 'true' && needs.release.outputs.already_published != 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
