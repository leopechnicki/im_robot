name: Auto Release (Friday)

# Releases whatever main holds under the version in package.json, to npm
# (publish.yml) and PyPI (publish-python.yml via the py-v<version> tag).
#
# The decision lives in scripts/release-plan.mjs (unit-tested in
# test/release-plan.test.ts). The run is GREEN only when main is fully
# released or a release was just made. Unreleased commits behind an
# already-released version turn it RED (job "guard") after the bump PR has
# been (re)opened -- the 2026-10/11 silent no-op (closed bump PR #135, tag
# v0.7.3 already there, warning + exit 0 for eight Fridays) cannot recur.

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    # Release only what main holds: a dispatch from another branch must not tag it.
    # Skipped here = red run (the guard requires release == success).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish_npm: ${{ steps.plan.outputs.publish_npm }}
      push_py_tag: ${{ steps.plan.outputs.push_py_tag }}
      open_bump_pr: ${{ steps.plan.outputs.open_bump_pr }}
      next_version: ${{ steps.plan.outputs.next_version }}
      blocked: ${{ steps.plan.outputs.blocked }}
      blocked_reason: ${{ steps.plan.outputs.blocked_reason }}
    steps:
      # The tag, the py tag and the bump PR MUST be created with a non-GITHUB_TOKEN
      # identity: GitHub starts no workflow runs for events made by GITHUB_TOKEN, so
      # the bump PR's required CI checks and the py-v* tag's PyPI publish would
      # never start. See PR #89 for the one-time App setup.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plan the release
        id: plan
        run: node scripts/release-plan.mjs plan

      - name: Create tag + GitHub release
        if: steps.plan.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          if ! node scripts/release-plan.mjs notes "$VERSION" > notes.md; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section; release notes fall back to the commit list."
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
            { echo "## What's Changed"; echo; git log --pretty=format:"- %s (%h)" --no-merges ${LAST_TAG:+"${LAST_TAG}..HEAD"}; } > notes.md
          fi
          # Pin the tag to the commit this run planned for, not whatever main is now.
          gh release create "$TAG" --title "Release $TAG" --notes-file notes.md --target "$(git rev-parse HEAD)"
          git fetch --tags --force origin

      - name: Push the PyPI tag
        if: steps.plan.outputs.push_py_tag == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          PY_TAG: ${{ steps.plan.outputs.py_tag }}
        run: |
          set -euo pipefail
          # Same commit as the npm tag. Pushed with the App token, so it starts
          # publish-python.yml (a GITHUB_TOKEN push would not).
          git tag "$PY_TAG" "${TAG}^{commit}"
          git push origin "refs/tags/${PY_TAG}"
          echo "::notice::pushed ${PY_TAG}; PyPI publish runs in the 'Publish Python SDK' workflow."

  publish:
    needs: release
    if: needs.release.outputs.publish_npm == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Own job so a failing bump PR can never hold back the npm publish.
  bump:
    needs: release
    if: needs.release.outputs.open_bump_pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Same commit the release job planned against (Axon B1): a bump that lands on
      # main in between must not make this job's commit empty.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Open (or reopen) the version-bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT_VERSION: ${{ needs.release.outputs.next_version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bump-version-v${NEXT_VERSION}"

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "::notice::bump PR #${OPEN_PR} (${BRANCH}) is already open."
            exit 0
          fi
          # A branch without an open PR is stale (its PR was closed): the old
          # code left it in place and skipped, which is how releases stalled.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::warning::${BRANCH} exists without an open PR; recreating it from main."
            git push origin --delete "$BRANCH"
          fi

          git checkout -B "$BRANCH"
          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
          node scripts/release-plan.mjs bump "$NEXT_VERSION"
          git add package.json package-lock.json python/pyproject.toml python/src/imrobot/_version.py
          git commit -m "chore: bump version to ${NEXT_VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: bump version to ${NEXT_VERSION}" \
            --body "Automated version bump after ${TAG}. Merging it lets the next Auto Release ship whatever main holds by then. Do not close it without bumping the version another way: while main has unreleased commits behind an already-released version, Auto Release fails on purpose. Add the \`## [${NEXT_VERSION}]\` CHANGELOG section before the release (the release notes come from it)." \
            --base main \
            --head "$BRANCH"

  # Last word on the run's colour. Green = released or nothing to release.
  guard:
    needs: [release, publish, bump]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly on a blocked or broken release
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          BUMP_RESULT: ${{ needs.bump.result }}
          BLOCKED: ${{ needs.release.outputs.blocked }}
          REASON: ${{ needs.release.outputs.blocked_reason }}
        run: |
          echo "release=${RELEASE_RESULT} publish=${PUBLISH_RESULT} bump=${BUMP_RESULT} blocked=${BLOCKED}"
          if [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::release job ${RELEASE_RESULT} (runs on main only)"; exit 1
          fi
          if [ "$BUMP_RESULT" = "failure" ] || [ "$BUMP_RESULT" = "cancelled" ]; then
            echo "::error::version-bump PR job ${BUMP_RESULT}"; exit 1
          fi
          if [ "$PUBLISH_RESULT" = "failure" ] || [ "$PUBLISH_RESULT" = "cancelled" ]; then
            echo "::error::npm publish ${PUBLISH_RESULT}"; exit 1
          fi
          if [ "$BLOCKED" = "true" ]; then
            echo "::error::${REASON}"; exit 1
          fi
          echo "ok"
