[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "imrobot"
version = "0.7.2"
description = "Reverse-CAPTCHA for AI agents — Python SDK (solver, verifier, FastAPI middleware, LangChain/CrewAI/AutoGPT-friendly)."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Leo Pechnicki", email = "leopsantos@hotmail.com" },
]
keywords = [
  "captcha", "reverse-captcha", "bot", "robot", "ai", "agent", "verification",
  "hmac", "jwt", "proof-of-agent", "middleware", "fastapi", "langchain", "crewai",
  "autogpt", "invisible", "crypto",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "fastapi>=0.100.0",
  "httpx>=0.27",
  "starlette>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://imrobot.vercel.app"
Repository = "https://github.com/leopechnicki/im_robot"
Issues = "https://github.com/leopechnicki/im_robot/issues"
Changelog = "https://github.com/leopechnicki/im_robot/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/imrobot"]

[tool.hatch.build.targets.sdist]
include = ["src/imrobot", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/imrobot"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
