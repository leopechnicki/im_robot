[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "imrobot"
version = "0.7.2"
description = "Reverse-CAPTCHA for AI agents — Python SDK (solver, verifier, FastAPI middleware, LangChain/CrewAI/AutoGPT-friendly)."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Leo Pechnicki", email = "leopsantos@hotmail.com" },
]
keywords = [
  "captcha", "reverse-captcha", "bot", "robot", "ai", "agent", "verification",
  "hmac", "jwt", "proof-of-agent", "middleware", "fastapi", "langchain", "crewai",
  "autogpt", "invisible", "crypto",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "fastapi>=0.100.0",
  "httpx>=0.27",
  "starlette>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://imrobot.vercel.app"
Repository = "https://github.com/leopechnicki/im_robot"
Issues = "https://github.com/leopechnicki/im_robot/issues"
Changelog = "https://github.com/leopechnicki/im_robot/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/imrobot"]

[tool.hatch.build.targets.sdist]
include = ["src/imrobot", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/imrobot"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
# We support Python 3.9 so cannot use PEP 604 union / Optional syntax (X | Y).
# We also alias imported classes with capitalized names in closures for readability
# — that's not a naming smell in our style, so N806 is disabled.
ignore = [
    "E501",   # line length handled by formatter
    "E402",   # tests use pytest.importorskip before other imports (intentional)
    "B008",   # FastAPI depends-in-defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B008"]

[tool.mypy]
# mypy dropped Python 3.9 support in v1.15+, but we still support Python 3.9
# at runtime (the SDK doesn't use any 3.10+ features). We tell mypy to
# analyze against 3.10 so newer mypy versions work — runtime remains 3.9-safe.
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
# We use dict-based structural typing for wire compatibility with JS; strict
# mode would require overwrought TypedDict overloads for every operation
# variant. The tests catch what strict typing would.
strict = false
ignore_missing_imports = true
